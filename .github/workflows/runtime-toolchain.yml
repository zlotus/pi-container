name: Runtime toolchain

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/runtime-toolchain.yml"
      - "apps/worker/**"
      - "apps/control-plane/src/model-gateway/**"
      - "deploy/model-gateway/**"
      - "packages/protocol/**"
      - "runtime/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [master]
    paths:
      - ".github/workflows/runtime-toolchain.yml"
      - "apps/worker/**"
      - "apps/control-plane/src/model-gateway/**"
      - "deploy/model-gateway/**"
      - "packages/protocol/**"
      - "runtime/**"
      - "package.json"
      - "pnpm-lock.yaml"
  schedule:
    # Weekly native AMD64/ARM64 evidence even without Runtime changes.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  native-runtime:
    name: linux/${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build native Runtime image
        run: >-
          docker build
          --platform linux/${{ matrix.architecture }}
          --tag agent-runtime:phase18-pi1.1
          runtime
      - name: Verify toolchain and real browser launch
        run: >-
          runtime/scripts/verify-image.sh
          agent-runtime:phase18-pi1.1
          ${{ matrix.architecture }}
      - name: Run Worker Runtime regressions
        env:
          TEST_DOCKER_RUNTIME: "1"
          TEST_RUNTIME_IMAGE: agent-runtime:phase18-pi1.1
        # Like a production Worker, the real-Docker tests must chown managed directories
        # to the Runtime user (UID 1000), which the unprivileged runner user cannot do.
        run: sudo -E env "PATH=$PATH" pnpm --filter @agent-runtime/worker test
      - name: Run the pinned model gateway against a mock upstream
        # Pulls the LiteLLM image pinned in deploy/model-gateway (specs.md Phase 16.14 Q8).
        run: pnpm test:model-gateway
