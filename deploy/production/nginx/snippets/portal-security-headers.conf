# Portal response headers (specs.md Phase 19.6). nginx drops inherited add_header lines in
# any location that adds its own, so every such location includes this file.
# $workspace_forms is https://*.<workspace domain>: the Portal opens a Workspace with a
# top-level form POST to the Workspace host.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self' $workspace_forms" always;
