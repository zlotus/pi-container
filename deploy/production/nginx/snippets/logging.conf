# Per-server logging (specs.md Phase 19.6). Declared in every server block so the image's
# default `access_log ... main` (which records the full request line, query string
# included) is not inherited. The error log records the request line too, so it only
# keeps critical events; failed upstreams still show in the access log's upstream_status
# and in the Control Plane's own logs.
access_log /var/log/nginx/access.log agent_runtime;
error_log /var/log/nginx/error.log crit;
