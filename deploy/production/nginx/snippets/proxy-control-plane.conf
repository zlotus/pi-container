# Portal API and SSO callbacks to the Control Plane (specs.md Phase 19.6).
proxy_http_version 1.1;
proxy_set_header Host $host;
# Overwrite, never append: the Control Plane trusts this proxy (AUTH_TRUSTED_PROXIES) and
# reads the client address from here for login throttling.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection "";
client_max_body_size 1m;
proxy_read_timeout 60s;
